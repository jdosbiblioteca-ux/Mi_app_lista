name: CI/CD Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libffi-dev \
            libssl-dev

    - name: Instalar Buildozer y herramientas de Android
      run: |
        python -m pip install --upgrade pip
        pip install --user --upgrade Cython==0.29.36 buildozer==1.5.0

    - name: Construir APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Subir artefacto (APK)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-debug
        path: bin/*.apk
